<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Internal Knowledge Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="login-screen" class="screen login-screen">
    <div class="login-card">
      <div class="brand">
        <div class="brand-logo">CO</div>
        <h1 class="brand-title">Company Knowledge Assistant</h1>
        <p class="brand-subtitle">Secure access to company knowledge</p>
      </div>
      <form id="login-form" class="login-form" autocomplete="off">
        <div class="field-group">
          <label for="username">Company email</label>
          <input type="email" id="username" name="username" placeholder="e.g. hr@company.com" required />
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
            <button type="button" id="toggle-password" class="toggle-password" aria-label="Show password">Show</button>
          </div>
        </div>
        <div id="login-error" class="error-box" hidden></div>
        <button type="submit" id="login-btn" class="btn-primary">
          <span id="login-btn-text">Sign In</span><span id="login-spinner" class="spinner" hidden></span>
        </button>
      </form>
      <p class="demo-role-label">Prototype demo accounts use password: <strong>demo123</strong></p>
    </div>
  </section>

  <section id="chat-screen" class="screen chat-screen" hidden>
    <header class="chat-header">
      <div class="chat-header-left"><div class="brand-logo small">CO</div><span class="chat-app-name">Company Knowledge Assistant</span></div>
      <div class="chat-header-right">
        <span id="current-username" class="current-username"></span>
        <span id="current-role-badge" class="role-badge"></span>
        <button id="logout-btn" class="btn-secondary">Logout</button>
      </div>
    </header>
    <main class="chat-main">
      <div class="chat-toolbar"><button id="clear-chat-btn" class="btn-ghost">Clear Chat</button></div>
      <div id="messages" class="messages"></div>
      <div id="loading-indicator" class="loading-indicator" hidden><span class="dot"></span><span class="dot"></span><span class="dot"></span> Searching company documents…</div>
      <form id="chat-form" class="chat-input-bar">
        <textarea id="chat-input" placeholder="Ask a question about company knowledge… (Shift+Enter for new line)" rows="1"></textarea>
        <button type="submit" id="send-btn" class="btn-primary send-btn">Send</button>
      </form>
    </main>
  </section>
  <script src="script.js"></script>
</body>
</html>
